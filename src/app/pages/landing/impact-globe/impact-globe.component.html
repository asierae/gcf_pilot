<div class="globe-media" aria-hidden="true">
  <div class="globe-fallback"></div>
  <canvas #canvas class="globe-canvas"></canvas>
</div>

<div class="globe-vignette" aria-hidden="true"></div>

<div class="globe-label-layer">
  <div class="globe-label" #globeLabel data-kind="finance">
    <span class="globe-label-dot"></span>
    <span class="globe-label-body">
      <span class="globe-label-role">Donor Source</span>
      <span class="globe-label-name">Global capital nodes</span>
    </span>
  </div>

  <div class="globe-label" #globeLabel data-kind="hub">
    <span class="globe-label-dot"></span>
    <span class="globe-label-body">
      <span class="globe-label-role">Avera Intervention</span>
      <span class="globe-label-name">Geneva &middot; Avera Hub</span>
    </span>
  </div>

  <div class="globe-label" #globeLabel data-kind="project">
    <span class="globe-label-dot"></span>
    <span class="globe-label-body">
      <span class="globe-label-role">Impact Goal</span>
      <span class="globe-label-name">East Africa Corridor</span>
    </span>
  </div>
</div>

<div class="globe-tip" #tip aria-hidden="true">
  <span class="globe-tip-role"></span>
  <span class="globe-tip-title"></span>
  <span class="globe-tip-detail"></span>
</div>
