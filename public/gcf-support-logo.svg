<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" role="img" aria-label="GCF Support">
  <defs>
    <linearGradient id="gcf-bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16A34A"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="gcf-shine" x1="4" y1="4" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="40" height="40" rx="10" fill="url(#gcf-bg)"/>
  <rect width="40" height="40" rx="10" fill="url(#gcf-shine)"/>
  <!-- Globe circle -->
  <circle cx="19" cy="18" r="9.5" stroke="#F0FDF4" stroke-width="1.4" opacity="0.92"/>
  <!-- Latitude arc (equator) -->
  <ellipse cx="19" cy="18" rx="9.5" ry="3.6" stroke="#F0FDF4" stroke-width="0.9" opacity="0.5"/>
  <!-- Vertical meridian -->
  <line x1="19" y1="8.5" x2="19" y2="27.5" stroke="#F0FDF4" stroke-width="0.9" opacity="0.5"/>
  <!-- Horizontal parallel -->
  <line x1="9.5" y1="18" x2="28.5" y2="18" stroke="#F0FDF4" stroke-width="0.9" opacity="0.4"/>
  <!-- Leaf badge (bottom-right) -->
  <circle cx="29" cy="29" r="7" fill="#15803D"/>
  <circle cx="29" cy="29" r="7" fill="#FFFFFF" fill-opacity="0.08"/>
  <!-- Leaf shape -->
  <path d="M29 24.5 C31.5 25.5 33 27.5 32.5 30 C31.5 32.5 29 33.5 27 32.5 C25 31.5 24.5 29 25.5 27 C26.5 25.2 28 24.2 29 24.5Z" fill="#BBF7D0"/>
  <!-- Leaf vein -->
  <path d="M29 24.5 C28 27 27.5 30 27 32.5" stroke="#16A34A" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
</svg>
